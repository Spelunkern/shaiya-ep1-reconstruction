name: Validate reconstruction contributions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  corpus-and-contributions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/check_distribution.py
      - run: python3 tools/reverse.py verify
      - run: python3 tools/reverse.py audit --originals
      - run: python3 tools/reverse.py validate
      - name: Install example test dependencies
        run: python3 -m pip install -r contributions/86424e839ec26fb4-fn-00001d80/tests/requirements.txt
      - name: Compile and compare first block with original x86 instructions
        run: python3 contributions/86424e839ec26fb4-fn-00001d80/tests/differential.py
