name: Validate reconstruction contributions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  corpus-and-contributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/reverse.py audit
      - run: python3 tools/reverse.py validate
